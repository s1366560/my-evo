# CI-specific docker-compose override
# Maps services to non-reserved host ports to avoid port conflicts in Drone runner.
# db/redis: no host ports (internal only)
# backend: 18081->3001 (app host port 18080 is reserved for platform deploy)
# frontend: 18082->3000 (frontend host port 18080 is reserved for platform deploy)
# The Drone deploy step uses host.docker.internal to reach containers.

services:
  db:
    ports: []

  redis:
    ports: []

  backend:
    ports:
      - "18081:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://evomap:evomap@db:5432/evomap
      - REDIS_URL=redis://redis:6379
      - NODE_SECRET=ci-dev-jwt-secret
      - SESSION_SECRET=ci-dev-session-secret
      - LOG_LEVEL=info
      - FEATURE_NEO4J_ENABLED=false
      - FEATURE_S3_ENABLED=false
      - OPENAI_API_KEY=

  frontend:
    ports:
      - "18082:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3001
      - NEXT_PUBLIC_WS_URL=ws://backend:3001
