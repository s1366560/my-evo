kind: pipeline
type: docker
name: workspace-ci

platform:
  os: linux
  arch: arm64

trigger:
  event:
    - push
    - custom
  branch:
    - main

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

steps:
  - name: repository-smoke
    image: node:20-alpine
    commands:
      - node --version
      - npm --version
      - test -f package.json
      - test -f backend/package.json
      - test -f frontend/package.json
      - node -e 'const fs=require("fs"); for (const f of ["package.json","backend/package.json","frontend/package.json"]) { const pkg=JSON.parse(fs.readFileSync(f,"utf8")); if (!pkg.scripts || Object.keys(pkg.scripts).length === 0) throw new Error(f + " has no scripts"); }'

  - name: backend-test
    image: node:20-alpine
    commands:
      - cd backend
      - npm install --silent
      - npm test
    when:
      event:
        - push
        - custom

  - name: frontend-build
    image: node:20-alpine
    commands:
      - cd frontend
      - npm install --silent
      - npm run build
    when:
      event:
        - push
        - custom

  - name: docker-build
    image: plugins/docker:20
    settings:
      repo: host.docker.internal:5001/my-evo
      tags:
        - drone-docker-e2e
        - latest
      registry: host.docker.internal:5001
      insecure: true
      purge: true
    when:
      event:
        - push
        - custom

  - name: deploy
    image: docker:cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - docker rm -f my-evo-app 2>/dev/null || true
      - docker network inspect workspace-deploy >/dev/null 2>&1 || docker network create workspace-deploy
      - |
        for attempt in 1 2 3; do
          echo "Deploy attempt $attempt/3"
          if docker run -d \
            --name my-evo-app \
            --network workspace-deploy \
            -p 18080:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            host.docker.internal:5001/my-evo:drone-docker-e2e; then
            echo "Container started successfully"
            break
          else
            echo "Container start failed (attempt $attempt/3)"
            docker rm -f my-evo-app 2>/dev/null || true
            sleep 2
          fi
        done
      - docker ps -a --filter "name=my-evo-app"
      - |
        for i in $(seq 1 30); do
          if wget -qO- http://host.docker.internal:18080/health >/dev/null 2>&1; then
            echo "Health check passed"
            exit 0
          fi
          echo "Waiting for health endpoint... ($i/30)"
          docker ps -a --filter "name=my-evo-app" --format "{{.Status}}"
          docker logs my-evo-app 2>&1 | tail -5
          sleep 2
        done
        echo "Health check failed - dumping container state"
        docker ps -a --filter "name=my-evo-app"
        docker logs my-evo-app 2>&1
        exit 1
    when:
      event:
        - push
        - custom
