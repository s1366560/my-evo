kind: pipeline
type: docker
name: workspace-ci

platform:
  os: linux
  arch: arm64

trigger:
  event:
    - push
    - custom
  branch:
    - main
    - master

steps:
  - name: repository-smoke
    image: node:20-alpine
    commands:
      - node --version
      - npm --version
      - test -f package.json
      - test -f backend/package.json
      - test -f frontend/package.json
      - node -e 'const fs=require("fs"); for (const f of ["package.json","backend/package.json","frontend/package.json"]) { const pkg=JSON.parse(fs.readFileSync(f,"utf8")); if (!pkg.scripts || Object.keys(pkg.scripts).length === 0) throw new Error(f + " has no scripts"); }'
      - echo "[repository-smoke] Installing root dependencies..."
      - npm ci --silent
      - echo "[repository-smoke] Running npm audit (blocking on high/critical)..."
      - npx npm-audit-with-level high 2>/dev/null || npm audit --audit-level=high
      - echo "[repository-smoke] Generating audit report artifacts..."
      - npm audit --json > npm-audit-root-report.json || true
      - cd backend && npm ci --silent && npm audit --json > npm-audit-backend-report.json || true && cd ..
      - cd frontend && npm ci --silent && npm audit --json > npm-audit-frontend-report.json || true && cd ..
      - "echo '[repository-smoke] Vulnerability scan complete. Reports: npm-audit-*-report.json'"

  - name: backend-test
    image: node:20-alpine
    commands:
      - cd backend
      - npm install --silent
      - npm test
    when:
      event:
        - push
        - custom

  - name: frontend-build
    image: node:20-alpine
    commands:
      - cd frontend
      - npm install --silent
      - npm run build
    when:
      event:
        - push
        - custom

  - name: docker-build
    image: plugins/docker:20
    settings:
      repo: host.docker.internal:5001/my-evo
      tags:
        - drone-docker-e2e
        - latest
      registry: host.docker.internal:5001
      insecure: true
      purge: true
    when:
      event:
        - push
        - custom

  - name: deploy
    image: docker:cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      POSTGRES_PASSWORD: evomap
      NODE_SECRET: dev-jwt-secret
      SESSION_SECRET: dev-session-secret
      DATABASE_URL: postgresql://evomap:evomap@db:5432/evomap
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - "echo '[deploy] Full project teardown: down + remove orphans + prune networks...'"
      - "docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans 2>/dev/null || true"
      - "docker stop $(docker ps -q --filter 'name=evomap') 2>/dev/null || true"
      - "docker rm -f $(docker ps -aq --filter 'name=evomap') 2>/dev/null || true"
      - "docker network rm $(docker network ls -q --filter 'name=my-evo') 2>/dev/null || true"
      - "docker network prune -f 2>/dev/null || true"
      - "echo '[deploy] Verifying ports are free...'"
      - "fuser 18080/tcp 2>/dev/null && echo 'WARN: port 18080 still busy after cleanup' || echo '[deploy] Port 18080 is free'"
      - "fuser 18081/tcp 2>/dev/null && echo 'WARN: port 18081 still busy after cleanup' || echo '[deploy] Port 18081 is free'"
      - "echo '[deploy] Starting dependency services (db, redis)...'"
      - "docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d db redis"
      - "for i in $(seq 1 30); do docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T db pg_isready -U evomap >/dev/null 2>&1 && break || sleep 1; done"
      - "sleep 2"
      - "docker build -t my-evo:drone-docker-e2e -f Dockerfile ."
      - "docker build -t my-evo-frontend:drone-docker-e2e -f frontend/Dockerfile ./frontend"
      - "docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d backend frontend"
      - "echo 'Waiting for backend health (checking host.docker.internal:18080)...'"
      - "for i in $(seq 1 30); do wget -qO- http://host.docker.internal:18080/health >/dev/null 2>&1 && break || sleep 2; done"
      - "wget -qO- http://host.docker.internal:18080/health || { docker compose -f docker-compose.yml -f docker-compose.ci.yml logs backend; exit 1; }"
      - "echo 'Waiting for frontend health (checking host.docker.internal:18081)...'"
      - "for i in $(seq 1 30); do wget -qO- http://host.docker.internal:18081/ >/dev/null 2>&1 && break || sleep 2; done"
      - "wget -qO- http://host.docker.internal:18081/ || { docker compose -f docker-compose.yml -f docker-compose.ci.yml logs frontend; exit 1; }"
      - "echo 'Deployment successful: backend + frontend containers are healthy'"
    when:
      event:
        - push
        - custom

  - name: e2e-test
    image: node:20-alpine
    environment:
      E2E_BASE_URL: http://host.docker.internal:18081
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    commands:
      - "cd frontend"
      - "npm install --silent"
      - "npx playwright install chromium --with-deps"
      - "npx playwright test --config playwright.test.config.ts --reporter=list 2>&1 | tee /tmp/e2e-output.txt"
      - "echo '--- E2E Test Summary ---'"
      - 'grep -E "(passed|failed|[0-9]+ test)" /tmp/e2e-output.txt || true'
    when:
      event:
        - push
        - custom

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock
