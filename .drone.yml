kind: pipeline
type: docker
name: workspace-ci

platform:
  os: linux
  arch: arm64

trigger:
  event:
    - push
    - custom
  branch:
    - main

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock

steps:
  - name: repository-smoke
    image: node:20-alpine
    commands:
      - node --version
      - npm --version
      - test -f package.json
      - test -f backend/package.json
      - test -f frontend/package.json
      - node -e 'const fs=require("fs"); for (const f of ["package.json","backend/package.json","frontend/package.json"]) { const pkg=JSON.parse(fs.readFileSync(f,"utf8")); if (!pkg.scripts || Object.keys(pkg.scripts).length === 0) throw new Error(f + " has no scripts"); }'

  - name: backend-test
    image: node:20-alpine
    commands:
      - cd backend
      - npm install --silent
      - npm test
    when:
      event:
        - push
        - custom

  - name: frontend-build
    image: node:20-alpine
    commands:
      - cd frontend
      - npm install --silent
      - npm run build
    when:
      event:
        - push
        - custom

  - name: docker-build
    image: plugins/docker:20
    settings:
      repo: host.docker.internal:5001/my-evo
      tags:
        - drone-docker-e2e
        - latest
      registry: host.docker.internal:5001
      insecure: true
      purge: true
    when:
      event:
        - push
        - custom

  - name: deploy
    image: docker:cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker rm -f my-evo-deploy 2>/dev/null || true
      - docker network inspect workspace-deploy >/dev/null 2>&1 || docker network create workspace-deploy
      - |
        for i in 1 2 3; do
          docker build -t my-evo:drone-docker-e2e -f Dockerfile . && break
          echo "Docker build attempt $i failed, retrying..."
          sleep 2
        done
      - |
        for i in 1 2 3; do
          docker run -d \
            --name my-evo-deploy \
            --network workspace-deploy \
            -p 18080:8080 \
            my-evo:drone-docker-e2e && break
          echo "Docker run attempt $i failed, cleaning up and retrying..."
          docker rm -f my-evo-deploy 2>/dev/null || true
          sleep 3
        done
      - |
        if docker ps --filter name=my-evo-deploy --format '{{.Names}}' | grep -q my-evo-deploy; then
          echo "Container my-evo-deploy is running"
          docker ps --filter name=my-evo-deploy
        else
          echo "ERROR: Container my-evo-deploy failed to start"
          docker ps -a --filter name=my-evo-deploy
          docker logs my-evo-deploy 2>&1 || true
          exit 1
        fi
      - sleep 5
      - wget --timeout=10 -q -O- http://host.docker.internal:18080/api/health || curl --max-time 10 -sf http://host.docker.internal:18080/api/health
      - echo "Deploy health check passed"
    when:
      event:
        - push
        - custom
