kind: pipeline
type: docker
name: workspace-ci

platform:
  os: linux
  arch: arm64

trigger:
  event:
    - push
    - custom
  branch:
    - main

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

steps:
  - name: repository-smoke
    image: node:20-alpine
    commands:
      - node --version
      - npm --version
      - test -f package.json
      - test -f backend/package.json
      - test -f frontend/package.json
      - node -e 'const fs=require("fs"); for (const f of ["package.json","backend/package.json","frontend/package.json"]) { const pkg=JSON.parse(fs.readFileSync(f,"utf8")); if (!pkg.scripts || Object.keys(pkg.scripts).length === 0) throw new Error(f + " has no scripts"); }'

  - name: backend-test
    image: node:20-alpine
    commands:
      - cd backend
      - npm install --silent
      - npm test
    when:
      event:
        - push
        - custom

  - name: frontend-build
    image: node:20-alpine
    commands:
      - cd frontend
      - npm install --silent
      - npm run build
    when:
      event:
        - push
        - custom

  - name: docker-build
    image: plugins/docker:20
    settings:
      repo: host.docker.internal:5001/my-evo
      tags:
        - drone-docker-e2e
        - latest
      registry: host.docker.internal:5001
      insecure: true
      purge: true
    when:
      event:
        - push
        - custom

  - name: deploy
    image: docker:cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - |
        # Clean up stale containers before deployment
        docker rm -f my-evo-deploy postgres-sidecar redis-sidecar 2>/dev/null || true
      - |
        # Ensure deploy network exists
        docker network inspect workspace-deploy >/dev/null 2>&1 || docker network create workspace-deploy
      - |
        # Build the image locally using the Dockerfile in the deploy step
        # This implements local_build deployment semantics per workspace contract
        docker build -t my-evo:drone-docker-e2e -f Dockerfile .
      - |
        # Start PostgreSQL sidecar
        docker run -d \
          --name postgres-sidecar \
          --network workspace-deploy \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=evomap \
          postgres:16-alpine
      - |
        # Wait for PostgreSQL to be ready
        for i in $(seq 1 30); do
          if docker exec postgres-sidecar pg_isready -U postgres >/dev/null 2>&1; then
            echo "PostgreSQL is ready"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "ERROR: PostgreSQL failed to become ready"
            docker logs postgres-sidecar
            exit 1
          fi
          sleep 1
        done
      - |
        # Start Redis sidecar
        docker run -d \
          --name redis-sidecar \
          --network workspace-deploy \
          redis:7-alpine
        sleep 2
      - |
        # Run the app container (transient port conflict retry)
        for i in 1 2 3; do
          docker rm -f my-evo-deploy 2>/dev/null || true
          docker run -d \
            --name my-evo-deploy \
            --network workspace-deploy \
            -p 18080:8080 \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e DATABASE_URL="postgresql://postgres:postgres@postgres-sidecar:5432/evomap" \
            -e REDIS_URL="redis://redis-sidecar:6379" \
            my-evo:drone-docker-e2e && break
          echo "Docker run attempt $i failed (port conflict or other), retrying..."
          sleep 3
        done
      - |
        # Verify container is running
        if docker ps --filter name=my-evo-deploy --format '{{.Names}}' | grep -q my-evo-deploy; then
          echo "Container my-evo-deploy is running"
          docker ps --filter name=my-evo-deploy
        else
          echo "ERROR: Container my-evo-deploy failed to start"
          docker ps -a --filter name=my-evo-deploy
          docker logs my-evo-deploy 2>&1 || true
          exit 1
        fi
      - |
        # Health check against host-mapped endpoint
        HEALTH_URL="http://host.docker.internal:18080/health"
        MAX_RETRIES=5
        for i in $(seq 1 $MAX_RETRIES); do
          if wget --timeout=10 -q -O- "$HEALTH_URL" >/dev/null 2>&1; then
            echo "Deploy health check passed (attempt $i)"
            exit 0
          fi
          echo "Health check attempt $i/$MAX_RETRIES failed, retrying..."
          sleep 3
        done
        echo "ERROR: Health check failed after $MAX_RETRIES attempts"
        docker ps -a --filter name=my-evo-deploy
        docker logs my-evo-deploy 2>&1 || true
        exit 1
    when:
      event:
        - push
        - custom
