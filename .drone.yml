kind: pipeline
type: docker
name: workspace-ci

platform:
  os: linux
  arch: arm64

trigger:
  event:
    - push
    - custom
  branch:
    - main

steps:
  - name: repository-smoke
    image: node:20-alpine
    commands:
      - "set -x"
      - node --version
      - npm --version
      - test -f package.json
      - test -f backend/package.json
      - test -f frontend/package.json
      - node -e 'const fs=require("fs"); for (const f of ["package.json","backend/package.json","frontend/package.json"]) { const pkg=JSON.parse(fs.readFileSync(f,"utf8")); if (!pkg.scripts || Object.keys(pkg.scripts).length === 0) throw new Error(f + " has no scripts"); }'
      - echo "[repository-smoke] Installing root dependencies..."
      - npm install --loglevel=info
      - echo "[repository-smoke] Running npm audit (blocking on critical only)..."
      - npm audit --audit-level=critical
      - echo "[repository-smoke] Generating audit report artifacts..."
      - npm audit --json > npm-audit-root-report.json || true
      - echo "[repository-smoke] Backend audit..."
      - cd backend && npm install --loglevel=info && npm audit --json > npm-audit-backend-report.json || true && cd ..
      - echo "[repository-smoke] Frontend audit..."
      - cd frontend && npm install --loglevel=info && npm audit --json > npm-audit-frontend-report.json || true && cd ..
      - "echo '[repository-smoke] Vulnerability scan complete. Reports: npm-audit-*-report.json'"

  - name: backend-test
    image: node:20-alpine
    commands:
      - cd backend
      - npm install --silent
      - npm test
    when:
      event:
        - push
        - custom

  - name: frontend-build
    image: node:20-alpine
    commands:
      - cd frontend
      - npm install --silent
      - npm run build
    when:
      event:
        - push
        - custom

  - name: docker-build
    image: plugins/docker:20
    settings:
      repo: host.docker.internal:5001/my-evo
      tags:
        - drone-docker-e2e
        - latest
      registry: host.docker.internal:5001
      insecure: true
      purge: true
    when:
      event:
        - push
        - custom

  - name: docker-build-frontend
    image: plugins/docker:20
    settings:
      repo: host.docker.internal:5001/my-evo-frontend
      tags:
        - drone-docker-e2e
        - latest
      registry: host.docker.internal:5001
      insecure: true
      purge: true
      dockerfile: frontend/Dockerfile
      context: ./frontend
    when:
      event:
        - push
        - custom

  - name: deploy
    image: docker:cli
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      POSTGRES_PASSWORD: evomap
      NODE_SECRET: dev-jwt-secret
      SESSION_SECRET: dev-session-secret
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - "echo '[deploy] Cleanup old containers...'"
      - "docker rm -f drone-backend drone-frontend drone-postgres drone-redis 2>/dev/null || true"
      - "docker network rm workspace-deploy 2>/dev/null || true"
      - "echo '[deploy] Creating workspace network...'"
      - "docker network create workspace-deploy 2>/dev/null || true"
      - "echo '[deploy] Starting postgres sidecar...'"
      - "docker run -d --name drone-postgres --network workspace-deploy -e POSTGRES_USER=evomap -e POSTGRES_PASSWORD=evomap -e POSTGRES_DB=evomap postgres:16-alpine"
      - "echo '[deploy] Starting redis sidecar...'"
      - "docker run -d --name drone-redis --network workspace-deploy redis:7-alpine"
      - "echo '[deploy] Waiting for postgres...'"
      - "for i in $(seq 1 30); do docker exec drone-postgres pg_isready -U evomap >/dev/null 2>&1 && break || sleep 1; done"
      - "echo '[deploy] Pulling backend image...'"
      - "docker pull host.docker.internal:5001/my-evo:latest"
      - "echo '[deploy] Pulling frontend image...'"
      - "docker pull host.docker.internal:5001/my-evo-frontend:latest"
      - "echo '[deploy] Starting backend on port 18080...'"
      - "docker run -d --name drone-backend --network workspace-deploy -p 18080:3001 -e NODE_ENV=production -e PORT=3001 -e DATABASE_URL=postgresql://evomap:evomap@drone-postgres:5432/evomap -e REDIS_URL=redis://drone-redis:6379 -e NODE_SECRET=dev-jwt-secret -e SESSION_SECRET=dev-session-secret host.docker.internal:5001/my-evo:latest"
      - "sleep 5"
      - "echo '[deploy] Starting frontend on port 18081...'"
      - "docker run -d --name drone-frontend --network workspace-deploy -p 18081:3000 -e NODE_ENV=production -e NEXT_PUBLIC_API_URL=http://drone-backend:3001 host.docker.internal:5001/my-evo-frontend:latest"
      - "sleep 3"
      - "echo '[deploy] Waiting for backend health...'"
      - "for i in $(seq 1 30); do docker exec drone-backend wget -qO- http://localhost:3001/health 2>/dev/null && break || sleep 2; done || { echo '[deploy] Backend health timeout'; docker logs drone-backend 2>&1 | tail -30; exit 1; }"
      - "echo '[deploy] Waiting for frontend health...'"
      - "for i in $(seq 1 30); do docker exec drone-frontend wget -qO- http://localhost:3000 2>/dev/null && break || sleep 2; done || { echo '[deploy] Frontend health timeout'; docker logs drone-frontend 2>&1 | tail -30; exit 1; }"
      - "echo '[deploy] Deployment verification complete'"
    when:
      event:
        - push
        - custom

  - name: e2e-test
    image: node:20-alpine
    environment:
      E2E_BASE_URL: http://host.docker.internal:18081
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    commands:
      - cd frontend
      - "npm install --silent"
      - "npx playwright install chromium --with-deps"
      - "npx playwright test --config playwright.test.config.ts --reporter=list 2>&1 | tee /tmp/e2e-output.txt"
      - "echo '--- E2E Test Summary ---'"
      - grep -E "(passed|failed|\d+ test)" /tmp/e2e-output.txt || true
    when:
      event:
        - push
        - custom

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock
